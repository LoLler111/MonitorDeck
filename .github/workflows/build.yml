# Controlla che il progetto compili a ogni push e pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compila
        shell: cmd
        run: build.bat nopause
      - uses: actions/upload-artifact@v7
        with:
          name: MonitorDeck
          path: MonitorDeck.exe
